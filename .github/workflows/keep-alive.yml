name: Keep database awake

on:
  schedule:
    # Every day at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "https://project--51bffc6d-fa98-47f2-b162-a7320629346f.lovable.app/api/public/health"
